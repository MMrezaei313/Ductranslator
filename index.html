<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>مترجم تخصصی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="logo">📚</div>
    <h1>مترجم تخصصی</h1>
    <p class="muted">PDF و Word — دوزبانه</p>
    <form id="loginForm" autocomplete="off">
      <label>نام کاربری</label>
      <input id="username" type="text" required autocomplete="username">
      <label>رمز عبور</label>
      <input id="password" type="password" required autocomplete="current-password">
      <button type="submit" class="btn btn-primary btn-block">ورود</button>
      <p id="loginError" class="error hidden">نام کاربری یا رمز اشتباه است.</p>
    </form>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="appbar">
    <strong>📚 مترجم تخصصی</strong>
    <div>
      <button id="wakeLockBtn" class="icon-btn" title="روشن ماندن صفحه">💤</button>
      <button id="settingsBtn" class="icon-btn" title="تنظیمات">⚙️</button>
      <button id="logoutBtn" class="icon-btn" title="خروج">🚪</button>
    </div>
  </header>

  <div class="status-bar">
    <span id="onlineStatus" class="status-pill online">🟢 آنلاین</span>
    <span id="wakeStatus" class="status-pill">💤 خاموش</span>
    <span id="usageStatus" class="status-pill">📊 —</span>
  </div>

  <main class="container">
    <section class="card">
      <h2>۱. فایل ورودی</h2>
      <input type="file" id="fileInput"
        accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
      <div id="fileInfo" class="file-info hidden"></div>
    </section>

    <section class="card hidden" id="domainCard">
      <h2>۲. حوزهٔ تخصصی</h2>
      <div id="detectedDomain"></div>
      <select id="domainSelect"></select>
    </section>

    <section class="card hidden" id="runCard">
      <h2>۳. حالت و محدوده</h2>

      <div class="grid-2" id="pageRangeRow">
        <div><label>از صفحه</label><input id="fromPage" type="number" value="1" min="1"></div>
        <div><label>تا صفحه</label><input id="toPage" type="number" value="3" min="1"></div>
      </div>

      <label>حالت ترجمه</label>
      <select id="modeSelect"></select>
      <p id="modeHint" class="muted small"></p>

      <div id="displayStyleRow">
        <label>چیدمان دوزبانه</label>
        <div class="style-toggle">
          <button type="button" class="style-btn" data-style="columns">📰 دو ستونی</button>
          <button type="button" class="style-btn" data-style="interlinear">📝 روی هم</button>
        </div>
      </div>

      <button id="startBtn" class="btn btn-primary btn-block">شروع / ادامه</button>
      <button id="cancelBtn" class="btn btn-danger btn-block hidden">لغو</button>

      <div id="progressWrap" class="progress-wrap hidden">
        <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
        <p id="progressText" class="muted small"></p>
        <p id="chunkStats" class="muted small"></p>
      </div>

      <button id="clearJobBtn" class="btn btn-ghost btn-block hidden">🗑 حذف ذخیرهٔ این فایل</button>
    </section>

    <section class="card hidden" id="outputCard">
      <div class="card-head">
        <h2>۴. خروجی</h2>
        <div class="btn-row">
          <button id="toggleOriginalBtn" class="btn btn-ghost btn-sm hidden">👁 پنهان اصل</button>
          <button id="copyBtn" class="btn btn-ghost btn-sm">کپی</button>
          <button id="downloadTxtBtn" class="btn btn-ghost btn-sm">TXT</button>
          <button id="downloadDocxBtn" class="btn btn-primary btn-sm hidden">DOCX</button>
          <button id="downloadHtmlBtn" class="btn btn-ghost btn-sm hidden">HTML</button>
        </div>
      </div>
      <div id="output" class="output" dir="rtl"></div>
    </section>

    <section class="card">
      <h2>واژه‌نامه</h2>
      <select id="glossaryViewSelect"></select>
      <div id="glossaryTable" class="glossary-table"></div>
    </section>
  </main>
</div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <div class="card-head">
      <h2>تنظیمات</h2>
      <button id="closeSettings" class="icon-btn" style="background:#f1f5f9;color:#334155;width:34px;height:34px;border-radius:10px">✖</button>
    </div>
    <label>ایمیل MyMemory (۵۰ هزار کاراکتر در روز)</label>
    <input id="mmEmail" type="email" dir="ltr" placeholder="you@example.com">
    <label>کلید DeepL API (اختیاری — بهترین کیفیت)</label>
    <input id="deeplKey" type="password" dir="ltr" placeholder="...:fx">
    <button id="saveSettings" class="btn btn-primary btn-block">ذخیره</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="script.js"></script>
</body>
</html>
