<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>مترجم تخصصی سریع</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ورود -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="logo">📚</div>
    <h1>مترجم تخصصی سریع</h1>
    <p class="muted">ترجمهٔ کتاب‌های علمی با واژه‌نامهٔ تخصصی</p>
    <form id="loginForm">
      <label>نام کاربری</label><input id="username" type="text" required autocomplete="username">
      <label>رمز عبور</label><input id="password" type="password" required autocomplete="current-password">
      <button type="submit" class="btn btn-primary btn-block">ورود</button>
      <p id="loginError" class="error hidden">نام کاربری یا رمز اشتباه است.</p>
    </form>
  </div>
</div>

<!-- برنامه -->
<div id="app" class="app hidden">
  <header class="appbar">
    <strong>📚 مترجم سریع</strong>
    <div>
      <button id="wakeLockBtn" class="icon-btn" title="روشن ماندن صفحه">💤</button>
      <button id="settingsBtn" class="icon-btn" title="تنظیمات">⚙️</button>
      <button id="logoutBtn" class="icon-btn" title="خروج">🚪</button>
    </div>
  </header>

  <div class="status-bar" id="statusBar">
    <span id="onlineStatus" class="status-pill online">🟢 آنلاین</span>
    <span id="wakeStatus" class="status-pill">💤 Wake Lock خاموش</span>
    <span id="usageStatus" class="status-pill">📊 مصرف: —</span>
  </div>

  <main class="container">
    <section class="card">
      <h2>۱. فایل PDF</h2>
      <input type="file" id="pdfInput" accept="application/pdf">
      <div id="fileInfo" class="file-info hidden"></div>
    </section>

    <section class="card hidden" id="domainCard">
      <h2>۲. حوزهٔ تخصصی</h2>
      <div id="detectedDomain"></div>
      <select id="domainSelect"></select>
    </section>

    <section class="card hidden" id="runCard">
      <h2>۳. محدوده و شروع</h2>
      <div class="grid-2">
        <div><label>از صفحه</label><input id="fromPage" type="number" value="1" min="1"></div>
        <div><label>تا صفحه</label><input id="toPage" type="number" value="200" min="1"></div>
      </div>
      <button id="startBtn" class="btn btn-primary btn-block">شروع / ادامهٔ ترجمه</button>
      <button id="cancelBtn" class="btn btn-danger btn-block hidden">لغو</button>
      <div id="progressWrap" class="progress-wrap hidden">
        <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
        <p id="progressText" class="muted small"></p>
        <p id="chunkStats" class="muted small"></p>
      </div>
      <button id="clearJobBtn" class="btn btn-ghost btn-block hidden">🗑 حذف ذخیرهٔ این فایل و شروع از نو</button>
    </section>

    <section class="card hidden" id="outputCard">
      <div class="card-head">
        <h2>۴. خروجی</h2>
        <div class="btn-row">
          <button id="copyBtn" class="btn btn-ghost btn-sm">کپی</button>
          <button id="downloadBtn" class="btn btn-ghost btn-sm">دانلود</button>
        </div>
      </div>
      <div id="output" class="output" dir="rtl"></div>
    </section>

    <section class="card">
      <h2>واژه‌نامه</h2>
      <select id="glossaryViewSelect"></select>
      <div id="glossaryTable" class="glossary-table"></div>
    </section>
  </main>
</div>

<!-- مودال تنظیمات -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <div class="card-head"><h2>تنظیمات</h2><button id="closeSettings" class="icon-btn" style="background:#f1f5f9;color:#334155;width:34px;height:34px;border-radius:10px">✖</button></div>
    <label>ایمیل MyMemory (سهمیه را به ۵۰ هزار کاراکتر در روز افزایش می‌دهد)</label>
    <input id="mmEmail" type="email" dir="ltr" placeholder="you@example.com">
    <label>کلید DeepL API (اختیاری — کیفیت بالاتر، ۵۰۰ هزار کاراکتر در ماه)</label>
    <input id="deeplKey" type="password" dir="ltr" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx:fx">
    <button id="saveSettings" class="btn btn-primary btn-block">ذخیره</button>
  </div>
</div>

<!-- مودال ادامه -->
<div id="resumeModal" class="modal hidden">
  <div class="modal-card">
    <h2>ادامهٔ ترجمهٔ قبلی؟</h2>
    <p>یک ترجمهٔ نیمه‌تمام برای همین فایل پیدا شد.</p>
    <p id="resumeInfo" class="muted small"></p>
    <button id="resumeYes" class="btn btn-primary btn-block">بله، ادامه بده</button>
    <button id="resumeNo" class="btn btn-ghost btn-block">خیر، از نو شروع کن</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="script.js"></script>
</body>
</html>
